    	<link href ="style4.css" rel="stylesheet" type="text/css">
		<script language="javascript" type="text/javascript">
			function validar(){
				var nom = form1.nome.value;
				var not = form1.nota.value;
				
				if(nom==""){
					alert('por favor, preecha o seu nome')
					form1.nome.focus();
					return false;
				}
				if(not==""){
					alert('por favor preencha o campo da nota')
					form1.nota.focus();
					return false;
				}	
					return true;
				}
			function processarform(){
				if(validar()){
				alert('dados enviados com sucesso');
				reset.form1;
				}
				return false;
			
			}
		</script>
	</head>
	<body>

			</ul>
		</nav>
		<div class="title">
			Deixe Sua Avaliação
		</div>
		<div class="avaliacao">
		<form name="form1" onsubmit="return processarform()" method="post">
				Nome:<input type="text" name="nome" size="20" maxlength="50"><br><br>
				Nota:<select name="nota">
						<option></option>
						<option>1</option>
						<option>2</option>
						<option>3</option>
						<option>4</option>
						<option>5</option>
					</select>
				<br><br>
				Sugestão:<textarea rows="15" cols="15"></textarea><br><br>
				<input type= "submit" value="enviar" onclick="return validar()">
				<input type= "reset" value="limpar">
		</form>
		</div>
